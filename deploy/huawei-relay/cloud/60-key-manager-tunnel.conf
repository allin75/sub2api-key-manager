Match User key-manager-tunnel
  AuthenticationMethods publickey
  PasswordAuthentication no
  KbdInteractiveAuthentication no
  AllowTcpForwarding remote
  PermitListen 127.0.0.1:13100
  PermitOpen none
  GatewayPorts no
  AllowAgentForwarding no
  X11Forwarding no
  PermitTTY no
  MaxSessions 0
Match all
